name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Lint (ruff, non-blocking if missing)
        run: |
          pip install ruff || true
          ruff check services eval tests || true

      - name: Unit tests
        run: pytest -q

      - name: Golden eval
        run: python eval/run_eval.py

      - name: Ingest smoke
        run: python services/ingest/ingest.py

      - name: Kustomize build (validate manifests)
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          ./kustomize build k8s/overlays/dev > /tmp/dev.yaml
          ./kustomize build k8s/overlays/prod > /tmp/prod.yaml
          grep -q agentops-api /tmp/dev.yaml

  image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push required)
        run: docker build -t agentops-api:ci -f services/api/Dockerfile .
